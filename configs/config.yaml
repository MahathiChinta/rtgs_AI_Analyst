dataset:
  infile: data/cleaned/tankers_cleaned_enhanced.csv
  scope_note: "Hyderabad water tanker deliveries — 6 months (example)"

rag:
  out_dir: outputs/rag
  embed_model: all-MiniLM-L6-v2
  use_faiss: false

llm:
  provider: gemini       # openai or manual
  model: gemini-2.5-pro
  temperature: 0.0
  max_tokens: 300

run:
  question: "Which localities show the largest unmet tanker demand? Provide short policy recommendations."
  k: 6
  auto_approve: false     # set true to auto-approve HITL for demo
